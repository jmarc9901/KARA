[package]
name = "kara-desktop"
version = "0.3.0"
description = "KARA — shell de escritorio (Tauri) para el runtime"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
